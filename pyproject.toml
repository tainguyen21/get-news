[project]
name = "get-news"
version = "0.1.0"
description = "Personal tech and world news digest in Vietnamese, delivered to Discord"
requires-python = ">=3.12,<3.13"
dependencies = [
    "feedparser>=6.0.14",
    "google-cloud-firestore>=2.34.1",
    "google-genai>=2.34.0",
    "googlenewsdecoder>=0.2.2",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "tld>=0.13.2",
    "trafilatura>=2.3.1",
]

[project.scripts]
get-news = "get_news.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/get_news"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
